<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BEEP SYSTEMS (TM)</title>
    <meta
        name="description"
        content="BEEP SYSTEMS is the terminal-style portfolio of Yevgeniy Sanitskiy, featuring QuadroFleet, HandelScore, and contact links."
    >
    <link href="/assets/style.css" rel="stylesheet">
</head>
<body>
<main id="terminal-window" aria-label="BEEP SYSTEMS terminal">
    <div class="terminal-shell">
        <div id="boot" aria-live="polite"></div>
        <div id="history" aria-live="polite"></div>

        <form id="command-form" class="prompt-line hidden" autocomplete="off">
            <span class="prompt" aria-hidden="true">&gt;</span>
            <label class="sr-only" for="inputcmd">Terminal command</label>
            <input
                id="inputcmd"
                type="text"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="terminal-hint"
            >
        </form>

        <p id="terminal-hint" class="hint hidden"></p>
    </div>
</main>

<noscript>
    <section class="noscript-card">
        <h1>BEEP SYSTEMS</h1>
        <p>Terminal-style portfolio by Yevgeniy Sanitskiy.</p>
        <p>Projects: QuadroFleet, HandelScore.</p>
        <p>LinkedIn: <a href="https://www.linkedin.com/in/yevgeniy-sanitskiy/">yevgeniy-sanitskiy</a></p>
        <p>Email: <a href="mailto:contact@beep.systems">contact@beep.systems</a></p>
    </section>
</noscript>

<script src="/assets/app.js"></script>
</body>
</html>
